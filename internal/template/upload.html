{{define "upload"}}
<!doctype html>
<html>
  <head>
    <title>File upload test</title>
  </head>
  <body>
    <h1>File upload</h1>
    <form name="form-nmap-upload" method="post" enctype="multipart/form-data" action="/upload">
      <div>
        <label for="nmap-upload">Upload an Nmap xml:</label>
        <input type="file" name="file" accept="application/xml">
      </div>
      <div>
        <button>submit</button>
      </div>
    </form>
  </body>
</html>
{{end}}
